  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.24'

      - name: Build and Package JUCE Plugin
        run: |
          rm -rf build
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release
          cpack -G DragNDrop  # Generate .dmg for macOS

      - name: Upload macOS plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-plugin
          path: |
            build/*_artefacts/Release/**
            build/*.dmg
            SimpleVolume-macOS.dmg
      
      #- name: Create DMG with only VST3  # for DMG
      #  run: |
          # Ordner für das .vst3 vorbereiten
      #    mkdir -p package
          # Pfad an dein Artefakt anpassen, falls der etwas anders heißt
      #    VST3_PATH="$(find build -type d -name '*.vst3' | head -n 1)"
      #    cp -R "$VST3_PATH" package/


          # .dmg erzeugen, das NUR diesen Ordner enthält
      #    hdiutil create \
      #      -volname "Simple Volume" \
      #      -srcfolder package \
      #      -ov -format UDZO SimpleVolume-macOS.dmg

      # workaround for using PlugIn without Apple Developer Licence
      - name: Create ZIP with only VST3
        run: |
          mkdir -p package
          VST3_PATH="$(find build -type d -name '*.vst3' | head -n 1)"
          echo "VST3_PATH=$VST3_PATH"
          cp -R "$VST3_PATH" package/

          cd package
          # zip muss "folder.vst3" als Ordner enthalten (VST3 ist ein Bundle)
          zip -r ../SimpleVolume-macOS.zip ./*.vst3

      - name: Upload macOS ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: |
            SimpleVolume-macOS.zip


  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.24'

      - name: Install Visual Studio Build Tools
        run: |
              choco install visualstudio2022buildtools -y
              choco install visualstudio2022-workload-nativedesktop -y
              
      - name: Install NSIS (for CPack NSIS generator)
        run: choco install nsis -y

      - name: Configure (Visual Studio)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Debug VST3 output (cmd)
        shell: cmd
        run: |
          dir /s "build\SimpleVolume\simpleVolume_artefacts\Release\VST3"

      - name: Clean CPack staging (before packaging)
        shell: pwsh
        run: |
          if (Test-Path build\_CPack_Packages) { Remove-Item -Recurse -Force build\_CPack_Packages }

      - name: Package (NSIS)
        run: |
          cd build
          cpack -G NSIS -C Release

      - name: Upload Windows plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PluginsByLeo-win64
          path: |
            build/*_artefacts/Release/**
            build/*.exe
